name: Markdown-IT

description: Write Markdown as task-descriptions for your students, this markdown interpreter additionally allows to integrate formulas, ASCII-art and videos. For more information, see <br><a href='https://github.com/edrys-labs/module-markdown-it' target='_blank'>https://github.com/edrys-labs/module-markdown-it</a>

show-in:
  - '*'

load:
  scripts:
    - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js
    - https://cdn.jsdelivr.net/npm/markdown-it-texmath@1.0.0/texmath.min.js
    - https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.js
    - https://cdnjs.cloudflare.com/ajax/libs/mermaid/9.2.2/mermaid.min.js
    - https://cdnjs.cloudflare.com/ajax/libs/markdown-it/13.0.1/markdown-it.min.js
    - https://edrys-labs.github.io/module/vendor/alpine.min.js
    - https://edrys-labs.github.io/module/edrys.js

  links:
    - https://cdn.jsdelivr.net/npm/markdown-it-texmath@1.0.0/css/texmath.min.css
    - https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.css
    - https://edrys-labs.github.io/module/vendor/water.min.css
    - https://edrys-labs.github.io/module/vendor/open-iconic/css/open-iconic.min.css

style: |-
  body {
    margin: 0px;
    padding: 1rem;
    min-width: calc(100% - 2rem);
    visibility: hidden; /* Hide until content is processed */
  }

  body.loaded {
    visibility: visible;
  }

  /* token colours from the highlight.js theme, background from water.css */
  .hljs {
    background: transparent;
  }

  .error {
    color: #b8384a;
  }

body: ""

main: |-
  // CommonJS package, converted to an ES module by jsDelivr
  const UML_PLUGIN_URL = "https://cdn.jsdelivr.net/npm/markdown-it-textual-uml@0.12.0/+esm"

  // load.links has no media attribute, so the light/dark highlight.js themes are added here
  for (const [scheme, theme] of [["light", "github"], ["dark", "github-dark"]]) {
      const link = document.createElement("link")
      link.rel = "stylesheet"
      link.media = "(prefers-color-scheme: " + scheme + ")"
      link.href = "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/" + theme + ".min.css"
      document.head.appendChild(link)
  }

  async function createRenderer() {
      const { default: markdownItTextualUml } = await import(UML_PLUGIN_URL)

      const md = markdownit({
          html: true,
          linkify: true,
          typographer: true,
          highlight(str, lang) {
              const code = lang && hljs.getLanguage(lang)
                  ? hljs.highlight(str, { language: lang, ignoreIllegals: true }).value
                  : md.utils.escapeHtml(str)
              return '<pre class="hljs"><code>' + code + '</code></pre>'
          }
      })

      md.use(
              texmath, {
                  engine: katex,
                  delimiters: 'dollars',
                  katexOptions: {
                      macros: {
                          "\\RR": "\\mathbb{R}"
                      }
                  }
              })
          .use(markdownItTextualUml)

      // diagrams are rendered explicitly in render(), once the content exists
      mermaid.initialize({ startOnLoad: false })

      return md
  }

  function render(md, content) {
      document.body.innerHTML = md.render(content)

      try {
          mermaid.init(undefined, document.querySelectorAll('.mermaid'))
      } catch (e) {
          // mermaid draws its own error box into the diagram; keep the rest of the content
          console.error("Markdown-IT: mermaid failed", e)
      }
  }

  function showError(e) {
      console.error("Markdown-IT:", e)
      const message = document.createElement("p")
      message.className = "error"
      message.textContent =
          "Markdown-IT could not render the content: " + (e && e.message ? e.message : e) +
          ". If a library failed to load, check that cdn.jsdelivr.net and cdnjs.cloudflare.com are reachable."
      document.body.replaceChildren(message)
  }

  Edrys.onReady(async () => {
      console.log("Markdown-IT loaded")

      const general = (Edrys.module.config || {}).content || ""
      const roleSpecific =
          (Edrys.module[Edrys.role.toLowerCase() + 'Config'] || {}).content || ""

      const content = [general, roleSpecific].filter(Boolean).join("\n\n")

      try {
          render(await createRenderer(), content)
      } catch (e) {
          showError(e)
      } finally {
          document.body.classList.add("loaded")
      }
  });
