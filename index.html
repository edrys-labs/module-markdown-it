<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="fetch" content="true" />

    <meta
      name="description"
      content="Write Markdown as task-descriptions for your students, this markdown interpreter additionally allows to integrate formulas, ASCII-art and videos. For more information, see <br><a href='https://github.com/edrys-labs/module-markdown-it' target='_blank'>https://github.com/edrys-labs/module-markdown-it</a>"
    />
    <meta name="show-in" content="*" />
    <meta 
      name="module-config" 
      content="{
        'config': {
          'content': {
            'type': 'code-area',
            'hint': 'Content to be shown for all roles',
          }
        },
        'teacherConfig': {
          'content': {
            'type': 'code-area',
            'hint': 'Content to be shown for teachers',
          }
        },
        'studentConfig': {
          'content': {
            'type': 'code-area',
            'hint': 'Content to be shown for students',
          }
        },
        'stationConfig': {
          'content': {
            'type': 'code-area',
            'hint': 'Content to be shown just in stations',
          }
        }
      }" 
    />

    <!-- one of them is switched off by applyCodeTheme() -->
    <link
      rel="stylesheet"
      data-code-theme="light"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github.min.css"
    />
    <link
      rel="stylesheet"
      data-code-theme="dark"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github-dark.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/markdown-it-texmath@1.0.0/css/texmath.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-texmath@1.0.0/texmath.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/9.2.2/mermaid.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it/13.0.1/markdown-it.min.js"></script>

    <script src="https://edrys-labs.github.io/module/edrys.js"></script>
    <link
      rel="stylesheet"
      href="https://edrys-labs.github.io/module/vendor/water.min.css"
    />
    <link
      rel="stylesheet"
      href="https://edrys-labs.github.io/module/edrys-module.css"
    />

    <script>
      // CommonJS package, converted to an ES module by jsDelivr
      const UML_PLUGIN_URL =
        'https://cdn.jsdelivr.net/npm/markdown-it-textual-uml@0.12.0/+esm'

      // The classroom's theme (edrys.js puts it on <html>), the OS preference when opened on its own
      const darkMode = matchMedia('(prefers-color-scheme: dark)')
      function isDark() {
        const theme = document.documentElement.dataset.theme
        return theme ? theme === 'dark' : darkMode.matches
      }

      // highlight.js's token colours for the theme; media instead of disabled, as a
      // link disabled before it loaded stays empty when enabled again
      function applyCodeTheme() {
        for (const link of document.querySelectorAll('link[data-code-theme]')) {
          link.media = (link.dataset.codeTheme === 'dark') === isDark() ? 'all' : 'not all'
        }
      }

      // Mermaid in the module's colours (edrys-module.css), its own dark or
      // light theme where those are missing
      function mermaidConfig() {
        const css = getComputedStyle(document.documentElement)
        const color = (name) => css.getPropertyValue(name).trim()
        if (!color('--edrys-bg')) {
          return { startOnLoad: false, theme: isDark() ? 'dark' : 'default' }
        }
        return {
          startOnLoad: false,
          theme: 'base',
          themeVariables: {
            darkMode: isDark(),
            background: color('--edrys-bg'),
            primaryColor: color('--edrys-code-bg'),
            primaryTextColor: color('--edrys-heading'),
            primaryBorderColor: color('--edrys-field-line'),
            lineColor: color('--edrys-muted'),
            textColor: color('--edrys-text'),
            edgeLabelBackground: color('--edrys-bg'),
            fontFamily: color('--edrys-font'),
          },
        }
      }

      async function createRenderer() {
        const { default: markdownItTextualUml } = await import(UML_PLUGIN_URL)

        const md = markdownit({
          html: true,
          linkify: true,
          typographer: true,
          highlight(str, lang) {
            const code =
              lang && hljs.getLanguage(lang)
                ? hljs.highlight(str, { language: lang, ignoreIllegals: true }).value
                : md.utils.escapeHtml(str)
            return '<pre class="hljs"><code>' + code + '</code></pre>'
          },
        })

        // markdown links open in a new tab, so the module keeps its content;
        // in-page anchors and raw HTML links are left as the author wrote them
        const linkOpen =
          md.renderer.rules.link_open ||
          ((tokens, idx, options, env, self) => self.renderToken(tokens, idx, options))
        md.renderer.rules.link_open = (tokens, idx, options, env, self) => {
          if (!(tokens[idx].attrGet('href') || '').startsWith('#')) {
            tokens[idx].attrSet('target', '_blank')
            tokens[idx].attrSet('rel', 'noopener')
          }
          return linkOpen(tokens, idx, options, env, self)
        }

        md.use(texmath, {
          engine: katex,
          delimiters: 'dollars',
          katexOptions: {
            macros: {
              '\\RR': '\\mathbb{R}',
            },
          },
        }).use(markdownItTextualUml)

        return md
      }

      // the renderer and content on screen, drawn again when the theme changes
      let shown = null

      // each block reads in the direction of its own text: Arabic or Hebrew right to left,
      // English left to right, also both in one document; code always left to right
      function setDirections() {
        // a paragraph inside a list item goes with its item
        document.body
          .querySelectorAll('p:not(li p), h1, h2, h3, h4, h5, h6, li, blockquote, table, dt, dd')
          .forEach((el) => el.setAttribute('dir', 'auto'))
        // a list puts its numbers or bullets on the side of its first item; "auto" would not
        // work here, it skips the text of children that have their own direction
        document.body.querySelectorAll('ul, ol').forEach((list) => {
          const first = list.querySelector(':scope > li')
          if (first) list.setAttribute('dir', getComputedStyle(first).direction)
        })
        document.body.querySelectorAll('pre').forEach((el) => el.setAttribute('dir', 'ltr'))
      }

      function render(md, content) {
        shown = { md, content }
        // diagrams are rendered explicitly below, once the content exists
        mermaid.initialize(mermaidConfig())
        document.body.innerHTML = md.render(content)
        setDirections()

        try {
          mermaid.init(undefined, document.querySelectorAll('.mermaid'))
        } catch (e) {
          // mermaid draws its own error box into the diagram; keep the rest of the content
          console.error('Markdown-IT: mermaid failed', e)
        }
      }

      function showError(e) {
        console.error('Markdown-IT:', e)
        const message = document.createElement('p')
        message.className = 'error'
        message.textContent =
          'Markdown-IT could not render the content: ' + (e && e.message ? e.message : e) +
          '. If a library failed to load, check that cdn.jsdelivr.net and cdnjs.cloudflare.com are reachable.'
        document.body.replaceChildren(message)
      }

      function applyTheme() {
        applyCodeTheme()
        if (!shown) return
        const scroll = window.scrollY
        render(shown.md, shown.content)
        window.scrollTo(0, scroll)
      }

      applyCodeTheme()
      darkMode.addEventListener('change', applyTheme)
      // onTheme is missing in edrys.js before the themes came
      Edrys.onTheme?.(applyTheme)

      Edrys.onReady(async () => {
        const general = (Edrys.module.config || {}).content || ''
        const roleSpecific =
          (Edrys.module[Edrys.role.toLowerCase() + 'Config'] || {}).content || ''

        const content = [general, roleSpecific].filter(Boolean).join('\n\n')

        try {
          render(await createRenderer(), content)
        } catch (e) {
          showError(e)
        } finally {
          document.body.classList.add('loaded')
        }
      })
    </script>

    <title>Markdown-IT</title>

    <style>
      body {
        margin: 0px;
        padding: 16px 18px;
      }

      /* replaced by the content or an error; appears only after 0.5s, so fast loads don't flicker */
      .loading {
        opacity: 0;
        animation: show-loading 0s 0.5s forwards;
      }

      @keyframes show-loading {
        to {
          opacity: 0.6;
        }
      }

      /* keep wide content inside narrow tiles instead of scrolling the whole page */
      img,
      iframe,
      video,
      svg {
        max-width: 100%;
      }

      img {
        height: auto;
      }

      table,
      .katex-display {
        display: block;
        overflow-x: auto;
      }

      /* token colours from the highlight.js theme, background from edrys-module.css */
      .hljs {
        background: transparent;
      }

      .error {
        color: var(--edrys-on-error-pill, #b8384a);
      }
    </style>
  </head>

  <body>
    <p class="loading">Loading&hellip;</p>
  </body>
</html>
